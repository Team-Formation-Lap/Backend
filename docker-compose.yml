version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - "3307:3306"
    env_file:
      - .env
    networks:
      - FLAP


  backend:
    build: .
    container_name: backend
    restart: always
    depends_on:
      - db
      - rabbitmq
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-intelliview}:${RABBITMQ_PASSWORD:-intelliview}@rabbitmq:5672//
    volumes:
      - .:/Backend
    ports:
      - "8000:8000"
    command: >
      sh -c "sleep 20 && python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - FLAP


  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-intelliview}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-intelliview}
    networks:
      - FLAP


  celery:
    container_name: celery
    build: .
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-intelliview}:${RABBITMQ_PASSWORD:-intelliview}@rabbitmq:5672//
    depends_on:
      - db
      - rabbitmq
    volumes:
      - .:/Backend
    command: celery -A apps worker -l info --concurrency=2
    networks:
      - FLAP

volumes:
  mysql_data:

networks:
  FLAP:
    driver: bridge
